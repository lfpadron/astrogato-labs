services:
  web:
    image: localhost/astrogato-web:1.0
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/es/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
