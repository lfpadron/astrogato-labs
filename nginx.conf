worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    map $uri $cache_control {
        default "no-cache";
        ~^/_astro/ "public, max-age=31536000, immutable";
        ~*\.(png|webp|svg|ico)$ "public, max-age=3600";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header Cache-Control $cache_control always;

        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
